<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Lexi Spend</title>
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lexi Spend">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="https://leiaorgana85-create.github.io/lexi-assets/spend-logo.png">
  <style>
    html, body { margin:0; min-height:100%; background:#0f1115; color:#f3f4f6; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { display:grid; place-items:center; }
    #loader { padding:24px; text-align:center; }
    #loader strong { display:block; font-size:22px; margin-bottom:8px; }
    #loader span { color:#9ca3af; }
    #loader.error span { color:#fca5a5; }
  </style>
</head>
<body>
  <div id="loader"><strong>Lexi Spend</strong><span>Loading…</span></div>
  <script>
    (async () => {
      const backendUrl = 'https://script.google.com/macros/s/AKfycby084l1Rupc838tdinecb2J5NCdOurkIa-smKFJqhypYINd_5walm15NLMWH7vSPWrA/exec';
      fetch(`${backendUrl}?lexiWarm=${Date.now()}`, {
        mode: 'no-cors',
        cache: 'no-store'
      }).catch(() => {});

      const files = [
        'payload/part1a.txt','payload/part1b.txt','payload/part2a.txt','payload/part2b.txt',
        'payload/part3aa.txt','payload/part3ab.txt','payload/part3b.txt','payload/part4a.txt',
        'payload/part4b.txt','payload/part5a.txt','payload/part5b.txt'
      ];
      try {
        if (typeof DecompressionStream !== 'function') throw new Error('This browser does not support the app loader.');
        const parts = await Promise.all(files.map(async path => {
          const response = await fetch(path, { cache:'no-store' });
          if (!response.ok) throw new Error(`Could not load ${path}`);
          return (await response.text()).trim();
        }));
        const binary = atob(parts.join(''));
        const bytes = new Uint8Array(binary.length);
        for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        let html = await new Response(stream).text();

        const oauthStart = html.indexOf('<script src="https://accounts.google.com/gsi/client"');
        const styleStart = oauthStart >= 0 ? html.indexOf('<style>', oauthStart) : -1;
        if (oauthStart < 0 || styleStart < 0) throw new Error('Lexi Spend source bridge marker was not found.');

        const closeScript = '</scr' + 'ipt>';
        const bridgeTags = [
          '<script src="./bridge-state.js">' + closeScript,
          '<script src="./bridge-auth.js">' + closeScript,
          '<script src="./bridge-call.js">' + closeScript,
          '<script src="./bridge-runtime.js">' + closeScript,
          '<script src="./bridge-settings.js">' + closeScript
        ].join('\n');
        html = html.slice(0, oauthStart) + bridgeTags + '\n\n  ' + html.slice(styleStart);

        html = html.replace(
          "setStatus('Refreshing live totals…');",
          "setStatus('');"
        );

        const startupCacheWrite = `          savedAt: Date.now(),
          localDate: localDate(),
          summary: state.summary || null,
          stayName: state.stayName || '',
          stayStart: state.stayStart || '',
          stayEnd: state.stayEnd || '',
          stayStatus: state.stayStatus || '',
          staySource: state.staySource || 'Stays'`;

        const startupCacheWriteFull = `          savedAt: Date.now(),
          localDate: localDate(),
          appVersion: state.appVersion || '',
          country: state.country || '',
          currency: state.currency || '',
          symbol: state.symbol || '',
          recent: Array.isArray(state.recent) ? state.recent : [],
          cash: state.cash || null,
          cashWallets: state.cashWallets || {},
          cashMonthWithdrawals: state.cashMonthWithdrawals || [],
          summary: state.summary || null,
          stayName: state.stayName || '',
          stayStart: state.stayStart || '',
          stayEnd: state.stayEnd || '',
          stayStatus: state.stayStatus || '',
          staySource: state.staySource || 'Stays'`;

        const startupCacheRestore = `      state.summary = cached.summary;
      state.stayName = cached.stayName || '';
      state.stayStart = cached.stayStart || '';
      state.stayEnd = cached.stayEnd || '';
      state.stayStatus = cached.stayStatus || '';
      state.staySource = cached.staySource || 'Stays';

      renderStayPeriodCurrent();
      renderSummary(state.summary);
      setStatus('');`;

        const startupCacheRestoreFull = `      state = {
        ...state,
        appVersion: cached.appVersion || state.appVersion,
        country: cached.country || state.country,
        currency: cached.currency || state.currency,
        symbol: cached.symbol || state.symbol,
        recent: Array.isArray(cached.recent) ? cached.recent : [],
        cash: cached.cash || null,
        cashWallets: cached.cashWallets || {},
        cashMonthWithdrawals: Array.isArray(cached.cashMonthWithdrawals)
          ? cached.cashMonthWithdrawals
          : [],
        summary: cached.summary,
        stayName: cached.stayName || '',
        stayStart: cached.stayStart || '',
        stayEnd: cached.stayEnd || '',
        stayStatus: cached.stayStatus || '',
        staySource: cached.staySource || 'Stays'
      };

      applyState();
      setStatus('');`;

        if (!html.includes(startupCacheWrite) || !html.includes(startupCacheRestore)) {
          throw new Error('Lexi Spend startup-cache markers were not found.');
        }

        html = html
          .replace(startupCacheWrite, startupCacheWriteFull)
          .replace(startupCacheRestore, startupCacheRestoreFull);

        const startupLiveRefresh = `  renderStartupStateCache();

  google.script.run
    .withSuccessHandler(r => {
      state = {
        ...state,
        ...r
      };

      applyState();
      setStatus('');
    })
    .withFailureHandler(err => {
      setStatus(
        err.message ||
        'Could not load app.',
        true
      );
    })
    .getAppState(
      localDate(),
      cashWalletCurrency
    );`;

        const startupLiveRefreshIdle = `  const hadStartupCache = renderStartupStateCache();

  const loadLiveStartupState = () => {
    if (isSaving || isCashSaving || isDeleting) {
      setTimeout(loadLiveStartupState, 1200);
      return;
    }

    google.script.run
      .withSuccessHandler(r => {
        state = {
          ...state,
          ...r
        };

        applyState();
        setStatus('');
      })
      .withFailureHandler(err => {
        setStatus(
          err.message ||
          'Could not load app.',
          true
        );
      })
      .getAppState(
        localDate(),
        cashWalletCurrency
      );
  };

  if (hadStartupCache) {
    let startupRefreshTimer = null;
    let startupRefreshStarted = false;
    const activityEvents = ['pointerdown', 'keydown', 'input', 'touchstart'];

    const stopStartupActivityWatch = () => {
      activityEvents.forEach(type =>
        document.removeEventListener(type, scheduleStartupRefresh, true)
      );
    };

    const runStartupRefresh = () => {
      if (startupRefreshStarted) return;
      startupRefreshStarted = true;
      stopStartupActivityWatch();
      loadLiveStartupState();
    };

    const scheduleStartupRefresh = () => {
      if (startupRefreshStarted) return;
      clearTimeout(startupRefreshTimer);
      startupRefreshTimer = setTimeout(runStartupRefresh, 8000);
    };

    activityEvents.forEach(type =>
      document.addEventListener(type, scheduleStartupRefresh, { capture:true, passive:true })
    );

    scheduleStartupRefresh();
  } else {
    loadLiveStartupState();
  }`;

        if (!html.includes(startupLiveRefresh)) {
          throw new Error('Lexi Spend startup live-refresh marker was not found.');
        }

        html = html.replace(startupLiveRefresh, startupLiveRefreshIdle);

        const recentThreeMarker = 'rows.slice(0, 3).forEach(x => {';
        if (!html.includes(recentThreeMarker)) {
          throw new Error('Lexi Spend recent-transaction marker was not found.');
        }
        html = html.replace(
          recentThreeMarker,
          'rows.slice(0, 3).forEach(x => {'
        );

        const uiStyleTag = '<link rel="stylesheet" href="./spend-ui.css?v=31">';
        const uiScriptTag = '<script src="./spend-ui.js?v=31">' + closeScript;
        const refineStyleTag = `<style id="lexiSpendRefineV31">
          .lexi-recent-title { font-size: 11px !important; }
          .lexi-entry-card #merchant::placeholder { font-size:13px !important; }
          .lexi-header-converter { margin-right:-2px !important; gap:2px !important; }
          .lexi-converter-input { width:88px !important; }
          .lexi-converter-output { min-width:52px !important; font-size:14px !important; text-align:left !important; }
          .lexi-entry-card .usdPreview:empty { display:none !important; min-height:0 !important; margin-top:0 !important; }
          .compactSummary > .lexi-section-title { display:none !important; }
          .lexi-cash-card .cashControlsRow {
            display:flex !important;
            justify-content:flex-start !important;
            align-items:flex-end !important;
            gap:6px !important;
          }
          .lexi-cash-card .cashCurrencyField {
            flex:0 0 140px !important;
            width:140px !important;
            min-width:0 !important;
          }
          .lexi-cash-card .cashActionButtons {
            flex:0 0 auto !important;
            margin:0 !important;
            padding:0 !important;
          }
          .lexi-cash-card #addCashBtn {
            min-width:180px !important;
            width:180px !important;
            padding-left:12px !important;
            padding-right:12px !important;
          }
          .lexi-atm-withdrawal-heading { font-size:15px !important; }
          .lexi-hide-atm-preview { display:none !important; }
          .lexi-notes-tools { gap:4px !important; padding-bottom:5px !important; }
          .lexi-note-tool {
            width:32px !important;
            min-width:32px !important;
            height:32px !important;
            min-height:32px !important;
            padding:3px !important;
            margin:0 !important;
            display:inline-flex !important;
            align-items:center !important;
            justify-content:center !important;
            font-size:0 !important;
          }
          .lexi-note-tool svg {
            width:22px !important;
            height:22px !important;
            display:block;
            stroke:currentColor;
            fill:none;
            stroke-width:1.9;
            stroke-linecap:round;
            stroke-linejoin:round;
          }
        </style>`;
        const refineScriptTag = '<script id="lexiSpendRefineScriptV31">' + `
          (() => {
            const icons = {
              bullet: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="7" r="1.4" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="5" cy="17" r="1.4" fill="currentColor" stroke="none"/><path d="M10 7h9M10 12h9M10 17h9"/></svg>',
              number: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2v5M4 11h4M4 15.5c.6-.8 1.2-1.2 2-1.2 1 0 1.8.7 1.8 1.6 0 1.6-3.8 2.1-3.8 4.1h4M11 7h9M11 17h9"/></svg>',
              check: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="6" height="6" rx="1"/><path d="m5 7 1.3 1.3L8.5 6M12 7h8M3.5 14h6v6h-6zM12 17h8"/></svg>',
              indent: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M3 9l3 3-3 3M6 12H2"/></svg>',
              undo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8 4 12l5 4M5 12h7c4.4 0 7 2 7 6"/></svg>',
              redo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 8 5 4-5 4M19 12h-7c-4.4 0-7 2-7 6"/></svg>',
              date: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 9h18M8 13h2M14 13h2M8 17h2M14 17h2"/></svg>'
            };

            function setIcon(selector, icon, label) {
              const button = document.querySelector(selector);
              if (!button || button.dataset.lexiIcon === icon) return;
              button.innerHTML = icons[icon];
              button.dataset.lexiIcon = icon;
              button.setAttribute('aria-label', label);
              button.setAttribute('title', label);
            }

            function refineNotesTools() {
              setIcon('.lexi-note-tool[data-note-prefix="• "]', 'bullet', 'Bullet');
              setIcon('.lexi-note-tool[data-note-numbered]', 'number', 'Number');
              setIcon('.lexi-note-tool[data-note-prefix="☐ "]', 'check', 'Check');
              setIcon('.lexi-note-tool[data-note-indent]', 'indent', 'Indent');
              setIcon('.lexi-note-tool[data-note-undo]', 'undo', 'Undo');
              setIcon('.lexi-note-tool[data-note-redo]', 'redo', 'Redo');
              setIcon('.lexi-note-tool[data-note-date]', 'date', 'Date');
            }

            function refineAtmDialog() {
              document.querySelectorAll('h1,h2,h3,h4,.dialogTitle,.modalTitle').forEach(el => {
                const text = (el.textContent || '').trim().toLowerCase();
                if (text.includes('atm withdrawal')) el.classList.add('lexi-atm-withdrawal-heading');
              });

              document.querySelectorAll('div,p,span,small,label').forEach(el => {
                const text = (el.textContent || '').trim().replace(/\\s+/g, ' ').toLowerCase();
                if (text === 'enter an amount to preview usd' || text === 'enter an amount to preview usd.') {
                  el.classList.add('lexi-hide-atm-preview');
                }
              });
            }

            function refineSpendPreview() {
              const preview = document.getElementById('usdPreview');
              if (!preview) return;
              const text = (preview.textContent || '').trim().replace(/\s+/g, ' ').toLowerCase();
              if (
                text === 'enter an amount to preview estimated usd.' ||
                text === 'enter an amount to preview estimated usd' ||
                text === 'enter an amount to preview usd.' ||
                text === 'enter an amount to preview usd'
              ) preview.textContent = '';
            }

            function refineAll() {
              refineNotesTools();
              refineAtmDialog();
              refineSpendPreview();
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', refineAll, { once:true });
            } else {
              refineAll();
            }

            let queued = false;
            const observer = new MutationObserver(() => {
              if (queued) return;
              queued = true;
              requestAnimationFrame(() => {
                queued = false;
                refineAll();
              });
            });
            observer.observe(document.documentElement, { childList:true, subtree:true });
          })();
        ` + closeScript;

        if (!html.includes('</head>') || !html.includes('</body>')) {
          throw new Error('Lexi Spend UI shell markers were not found.');
        }

        html = html.replace('<h1>Spend Log</h1>', '<h1>Lexi Spend</h1>');
        html = html.replace('</head>', uiStyleTag + '\n' + refineStyleTag + '\n</head>');
        html = html.replace('</body>', uiScriptTag + '\n' + refineScriptTag + '\n</body>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const loader = document.getElementById('loader');
        loader.classList.add('error');
        loader.querySelector('span').textContent = error?.message || 'Could not load Lexi Spend.';
      }
    })();
  </script>
</body>
</html>
