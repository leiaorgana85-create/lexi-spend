<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Lexi Spend Backend Test</title>
  <meta name="theme-color" content="#111111">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #111; color: #fff; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(520px, calc(100% - 32px)); }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: #bdbdbd; line-height: 1.45; }
    button { width: 100%; margin-top: 18px; padding: 15px 18px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    #status { margin-top: 18px; padding: 14px; background: #1d1d1d; border-radius: 12px; white-space: pre-wrap; word-break: break-word; min-height: 48px; }
    .ok { color: #9ee7a6; }
    .err { color: #ff9b9b; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <h1>Lexi Spend</h1>
    <p>Read-only real-backend test. This calls <code>getAppState()</code> from the copied Spend Log backend. It does not add, edit, or delete anything.</p>
    <button id="connect" type="button">Connect Google & Test Real Backend</button>
    <div id="status">Ready.</div>
  </main>

  <script>
    (() => {
      'use strict';

      const CLIENT_ID = '746921963687-206tvg2gn6mo74gb1ej07sck6lftoe62.apps.googleusercontent.com';
      const DEPLOYMENT_ID = 'AKfycbzU-ORThi93pC00cw40FdsYK33rhaateLlPQcwlrfRwo_4pp1sYJqKOVfx5C41Rk1TA';
      const SCOPES = [
        'https://www.googleapis.com/auth/spreadsheets',
        'https://www.googleapis.com/auth/drive',
        'https://www.googleapis.com/auth/script.external_request'
      ].join(' ');
      const RUN_URL = `https://script.googleapis.com/v1/scripts/${DEPLOYMENT_ID}:run`;

      const button = document.getElementById('connect');
      const status = document.getElementById('status');
      let tokenClient = null;

      function localDate() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.className = isError ? 'err' : '';
      }

      async function callScript(accessToken, functionName, parameters = []) {
        const response = await fetch(RUN_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ function: functionName, parameters })
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(payload?.error?.message || `HTTP ${response.status}`);
        }

        if (payload.error) {
          const details = payload.error.details?.[0];
          throw new Error(details?.errorMessage || payload.error.message || 'Apps Script execution failed.');
        }

        return payload.response?.result;
      }

      async function runRealBackendTest(accessToken) {
        const today = localDate();
        setStatus(`Connected. Calling getAppState(${today}, THB)…`);

        const result = await callScript(accessToken, 'getAppState', [today, 'THB']);

        if (!result || !result.appVersion) {
          throw new Error('getAppState() returned an unexpected result.');
        }

        status.className = 'ok';
        status.textContent = [
          'REAL BACKEND TEST PASSED ✓',
          `App version: ${result.appVersion}`,
          `Country: ${result.country || '—'}`,
          `Currency: ${result.currency || '—'}`,
          `Stay: ${result.stayName || '—'}`,
          `Stay dates: ${result.stayStart || '—'} → ${result.stayEnd || '—'}`,
          `Stay status: ${result.stayStatus || '—'}`,
          `Recent transactions loaded: ${Array.isArray(result.recent) ? result.recent.length : '—'}`,
          `Cash wallet: ${result.cash?.currency || '—'}`,
          `Browser local date sent: ${today}`
        ].join('\n');
      }

      function initTokenClient() {
        if (!window.google?.accounts?.oauth2) {
          throw new Error('Google Identity Services has not loaded yet. Try again in a moment.');
        }

        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: async tokenResponse => {
            if (tokenResponse.error) {
              setStatus(`Google authorization failed: ${tokenResponse.error}`, true);
              button.disabled = false;
              return;
            }

            try {
              await runRealBackendTest(tokenResponse.access_token);
            } catch (error) {
              setStatus(`Backend test failed: ${error.message}`, true);
            } finally {
              button.disabled = false;
            }
          },
          error_callback: error => {
            setStatus(`Google authorization failed: ${error.type || 'unknown error'}`, true);
            button.disabled = false;
          }
        });
      }

      button.addEventListener('click', () => {
        button.disabled = true;
        setStatus('Opening Google authorization…');

        try {
          if (!tokenClient) initTokenClient();
          tokenClient.requestAccessToken({ prompt: 'consent' });
        } catch (error) {
          setStatus(error.message, true);
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
