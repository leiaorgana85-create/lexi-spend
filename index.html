<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Lexi Spend</title>
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lexi Spend">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="https://leiaorgana85-create.github.io/lexi-assets/spend-logo.png">
  <style>
    html, body { margin:0; min-height:100%; background:#0f1115; color:#f3f4f6; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { display:grid; place-items:center; }
    #loader { padding:24px; text-align:center; }
    #loader strong { display:block; font-size:22px; margin-bottom:8px; }
    #loader span { color:#9ca3af; }
    #loader.error span { color:#fca5a5; }
  </style>
</head>
<body>
  <div id="loader"><strong>Lexi Spend</strong><span>Loading…</span></div>
  <script>
    (async () => {
      const backendUrl = 'https://script.google.com/macros/s/AKfycby084l1Rupc838tdinecb2J5NCdOurkIa-smKFJqhypYINd_5walm15NLMWH7vSPWrA/exec';
      fetch(`${backendUrl}?lexiWarm=${Date.now()}`, {
        mode: 'no-cors',
        cache: 'no-store'
      }).catch(() => {});

      const files = [
        'payload/part1a.txt','payload/part1b.txt','payload/part2a.txt','payload/part2b.txt',
        'payload/part3aa.txt','payload/part3ab.txt','payload/part3b.txt','payload/part4a.txt',
        'payload/part4b.txt','payload/part5a.txt','payload/part5b.txt'
      ];
      try {
        if (typeof DecompressionStream !== 'function') throw new Error('This browser does not support the app loader.');
        const parts = await Promise.all(files.map(async path => {
          const response = await fetch(path, { cache:'no-store' });
          if (!response.ok) throw new Error(`Could not load ${path}`);
          return (await response.text()).trim();
        }));
        const binary = atob(parts.join(''));
        const bytes = new Uint8Array(binary.length);
        for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        let html = await new Response(stream).text();

        const oauthStart = html.indexOf('<script src="https://accounts.google.com/gsi/client"');
        const styleStart = oauthStart >= 0 ? html.indexOf('<style>', oauthStart) : -1;
        if (oauthStart < 0 || styleStart < 0) throw new Error('Lexi Spend source bridge marker was not found.');

        const closeScript = '</scr' + 'ipt>';
        const bridgeTags = [
          '<script src="./bridge-state.js">' + closeScript,
          '<script src="./bridge-auth.js">' + closeScript,
          '<script src="./bridge-call.js">' + closeScript,
          '<script src="./bridge-runtime.js">' + closeScript,
          '<script src="./bridge-settings.js">' + closeScript
        ].join('\n');
        html = html.slice(0, oauthStart) + bridgeTags + '\n\n  ' + html.slice(styleStart);

        html = html.replace(
          "setStatus('Refreshing live totals…');",
          "setStatus('');"
        );

        const startupCacheWrite = `          savedAt: Date.now(),
          localDate: localDate(),
          summary: state.summary || null,
          stayName: state.stayName || '',
          stayStart: state.stayStart || '',
          stayEnd: state.stayEnd || '',
          stayStatus: state.stayStatus || '',
          staySource: state.staySource || 'Stays'`;

        const startupCacheWriteFull = `          savedAt: Date.now(),
          localDate: localDate(),
          appVersion: state.appVersion || '',
          country: state.country || '',
          currency: state.currency || '',
          symbol: state.symbol || '',
          recent: Array.isArray(state.recent) ? state.recent : [],
          cash: state.cash || null,
          cashWallets: state.cashWallets || {},
          cashMonthWithdrawals: state.cashMonthWithdrawals || [],
          summary: state.summary || null,
          stayName: state.stayName || '',
          stayStart: state.stayStart || '',
          stayEnd: state.stayEnd || '',
          stayStatus: state.stayStatus || '',
          staySource: state.staySource || 'Stays'`;

        const startupCacheRestore = `      state.summary = cached.summary;
      state.stayName = cached.stayName || '';
      state.stayStart = cached.stayStart || '';
      state.stayEnd = cached.stayEnd || '';
      state.stayStatus = cached.stayStatus || '';
      state.staySource = cached.staySource || 'Stays';

      renderStayPeriodCurrent();
      renderSummary(state.summary);
      setStatus('');`;

        const startupCacheRestoreFull = `      state = {
        ...state,
        appVersion: cached.appVersion || state.appVersion,
        country: cached.country || state.country,
        currency: cached.currency || state.currency,
        symbol: cached.symbol || state.symbol,
        recent: Array.isArray(cached.recent) ? cached.recent : [],
        cash: cached.cash || null,
        cashWallets: cached.cashWallets || {},
        cashMonthWithdrawals: Array.isArray(cached.cashMonthWithdrawals)
          ? cached.cashMonthWithdrawals
          : [],
        summary: cached.summary,
        stayName: cached.stayName || '',
        stayStart: cached.stayStart || '',
        stayEnd: cached.stayEnd || '',
        stayStatus: cached.stayStatus || '',
        staySource: cached.staySource || 'Stays'
      };

      applyState();
      setStatus('');`;

        if (!html.includes(startupCacheWrite) || !html.includes(startupCacheRestore)) {
          throw new Error('Lexi Spend startup-cache markers were not found.');
        }

        html = html
          .replace(startupCacheWrite, startupCacheWriteFull)
          .replace(startupCacheRestore, startupCacheRestoreFull);

        const startupLiveRefresh = `  renderStartupStateCache();

  google.script.run
    .withSuccessHandler(r => {
      state = {
        ...state,
        ...r
      };

      applyState();
      setStatus('');
    })
    .withFailureHandler(err => {
      setStatus(
        err.message ||
        'Could not load app.',
        true
      );
    })
    .getAppState(
      localDate(),
      cashWalletCurrency
    );`;

        const startupLiveRefreshIdle = `  const hadStartupCache = renderStartupStateCache();

  const loadLiveStartupState = () => {
    if (isSaving || isCashSaving || isDeleting) {
      setTimeout(loadLiveStartupState, 1200);
      return;
    }

    google.script.run
      .withSuccessHandler(r => {
        state = {
          ...state,
          ...r
        };

        applyState();
        setStatus('');
      })
      .withFailureHandler(err => {
        setStatus(
          err.message ||
          'Could not load app.',
          true
        );
      })
      .getAppState(
        localDate(),
        cashWalletCurrency
      );
  };

  if (hadStartupCache) {
    let startupRefreshTimer = null;
    let startupRefreshStarted = false;
    const activityEvents = ['pointerdown', 'keydown', 'input', 'touchstart'];

    const stopStartupActivityWatch = () => {
      activityEvents.forEach(type =>
        document.removeEventListener(type, scheduleStartupRefresh, true)
      );
    };

    const runStartupRefresh = () => {
      if (startupRefreshStarted) return;
      startupRefreshStarted = true;
      stopStartupActivityWatch();
      loadLiveStartupState();
    };

    const scheduleStartupRefresh = () => {
      if (startupRefreshStarted) return;
      clearTimeout(startupRefreshTimer);
      startupRefreshTimer = setTimeout(runStartupRefresh, 8000);
    };

    activityEvents.forEach(type =>
      document.addEventListener(type, scheduleStartupRefresh, { capture:true, passive:true })
    );

    scheduleStartupRefresh();
  } else {
    loadLiveStartupState();
  }`;

        if (!html.includes(startupLiveRefresh)) {
          throw new Error('Lexi Spend startup live-refresh marker was not found.');
        }

        html = html.replace(startupLiveRefresh, startupLiveRefreshIdle);

        const uiStyleTag = '<link rel="stylesheet" href="./spend-ui.css?v=2">';
        const uiScriptTag = '<script src="./spend-ui.js?v=3">' + closeScript;

        if (!html.includes('</head>') || !html.includes('</body>')) {
          throw new Error('Lexi Spend UI shell markers were not found.');
        }

        html = html.replace('<h1>Spend Log</h1>', '<h1>Lexi Spend</h1>');
        html = html.replace('</head>', uiStyleTag + '\n</head>');
        html = html.replace('</body>', uiScriptTag + '\n</body>');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const loader = document.getElementById('loader');
        loader.classList.add('error');
        loader.querySelector('span').textContent = error?.message || 'Could not load Lexi Spend.';
      }
    })();
  </script>
</body>
</html>
