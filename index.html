<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Lexi Spend</title>
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lexi Spend">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="https://leiaorgana85-create.github.io/lexi-assets/spend-logo.png">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0f1115;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { display: grid; place-items: center; }
    #loader { padding: 24px; text-align: center; }
    #loader strong { display: block; font-size: 22px; margin-bottom: 8px; }
    #loader span { color: #9ca3af; }
    #loader.error span { color: #fca5a5; }
  </style>
</head>
<body>
  <div id="loader"><strong>Lexi Spend</strong><span>Loading…</span></div>
  <script>
    (async () => {
      const files = [
        'payload/part1a.txt',
        'payload/part1b.txt',
        'payload/part2a.txt',
        'payload/part2b.txt',
        'payload/part3aa.txt',
        'payload/part3ab.txt',
        'payload/part3b.txt',
        'payload/part4a.txt',
        'payload/part4b.txt',
        'payload/part5a.txt',
        'payload/part5b.txt'
      ];

      try {
        if (typeof DecompressionStream !== 'function') {
          throw new Error('This browser does not support the app loader.');
        }

        const parts = await Promise.all(files.map(async path => {
          const response = await fetch(path, { cache: 'no-store' });
          if (!response.ok) throw new Error(`Could not load ${path}`);
          return (await response.text()).trim();
        }));

        const binary = atob(parts.join(''));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

        const stream = new Blob([bytes])
          .stream()
          .pipeThrough(new DecompressionStream('gzip'));
        let html = await new Response(stream).text();

        /*
          iOS/Safari requires the Google OAuth popup request to remain in the
          direct button-click call stack. The original bridge awaited a polling
          helper first, which can cause the popup to be rejected on Safari.
        */
        html = html
          .replace('async function beginOAuth() {', 'function beginOAuth() {')
          .replace('      await waitForIdentityServices();\n\n', '')
          .replace(
            ": 'Google authorization failed. Try again.';",
            ": `Google authorization failed (${error?.type || 'unknown_error'}). Try again.`;"
          );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const loader = document.getElementById('loader');
        loader.classList.add('error');
        loader.querySelector('span').textContent = error?.message || 'Could not load Lexi Spend.';
      }
    })();
  </script>
</body>
</html>
