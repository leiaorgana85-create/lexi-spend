name: Anonymous browser surface verification
on:
  pull_request:
    paths: ['.github/workflows/privacy-audit-snapshot.yml']
permissions:
  contents: read
jobs:
  browser-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public bridge client API without invoking any server function
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bridge-audit
          npm install --prefix /tmp/bridge-audit --no-save --ignore-scripts playwright >/tmp/bridge-audit/npm.log 2>&1
          cat >/tmp/bridge-audit/check.cjs <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const source=await (await fetch('https://raw.githubusercontent.com/leiaorgana85-create/lexi-spend/7bbfdcfae83dd4039203a0959036f2b70297d358/v2/api.js')).text();
            const url=source.match(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/)[0];
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            try {
              const page=await browser.newPage();
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              let found=null;
              for(let i=0;i<20&&!found;i++){
                for(const frame of page.frames()){
                  try {
                    const result=await frame.evaluate(()=>{
                      const r=window.google?.script?.run;
                      if(!r)return null;
                      return {gateway:typeof r.bridgeExecuteV2==='function',
                        readSurface:['getAppState','getCashWallet','getDashboard','exportStayCsv'].filter(k=>typeof r[k]==='function').length,
                        writeSurface:['logExpense','deleteExpense','addCashWithdrawal','deleteCashWithdrawal','uploadReceipt','deleteReceiptFile','runSchemaMaintenance'].filter(k=>typeof r[k]==='function').length,
                        credentialSetup:typeof r.setupLexiSpendApiCode==='function'};
                    });
                    if(result&&result.gateway){found=result;break;}
                  } catch {}
                }
                if(!found)await page.waitForTimeout(1000);
              }
              console.log('ANONYMOUS_BRIDGE_SURFACE',JSON.stringify(found));
              if(!found)process.exitCode=2;
            } finally {await browser.close();}
          })().catch(e=>{console.log('PROBE_ERROR',e.name);process.exitCode=2;});
          JS
          node /tmp/bridge-audit/check.cjs
