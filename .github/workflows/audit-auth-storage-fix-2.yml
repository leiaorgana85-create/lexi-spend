name: Apply corrected auth-storage fix
on:
  push:
    branches: [audit/auth-storage-v1.03]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/auth-storage-v1.03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproduce, patch, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/auth-storage-regression.mjs <<'TEST'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          const source = fs.readFileSync('v2/api.js','utf8');
          function harness(localCode='') {
            const values=new Map(); if(localCode)values.set('lexiSpendPrivateApiCodeV1',localCode);
            const timers=[]; let deleted=0;
            const localStorage={getItem:k=>values.has(k)?values.get(k):null,setItem:(k,v)=>values.set(k,String(v)),removeItem:k=>values.delete(k)};
            const document={body:{appendChild(n){n.isConnected=true;}},createElement(){return {style:{},isConnected:false,setAttribute(){},remove(){this.isConnected=false;}};}};
            const indexedDB={open(){return {};},deleteDatabase(){deleted++;return {};}};
            const window={document,localStorage,indexedDB,addEventListener(){}};
            const context={window,document,localStorage,indexedDB,navigator:{onLine:true},URL,console,
              setTimeout(fn,ms){const t={fn,ms,cleared:false};timers.push(t);return t;},clearTimeout(t){if(t)t.cleared=true;}};
            context.globalThis=context; vm.runInNewContext(source,context,{filename:'v2/api.js'});
            return {window,timers,values,deleted:()=>deleted};
          }
          {
            const h=harness(); const pending=h.window.SpendApi.hasCode(); await Promise.resolve();
            const deadline=h.timers.find(t=>t.ms===5000&&!t.cleared);
            assert.ok(deadline,'authorization storage lookup must have a 5-second deadline');
            deadline.fn(); assert.equal(await pending,false);
            assert.equal(h.deleted(),0); assert.equal(h.values.size,0);
          }
          {
            const h=harness('saved-code'); assert.equal(await h.window.SpendApi.hasCode(),true);
            assert.equal(h.timers.some(t=>t.ms===5000&&!t.cleared),false);
            assert.equal(h.values.get('lexiSpendPrivateApiCodeV1'),'saved-code');
          }
          console.log('PASS bounded authorization storage fallback');
          TEST
          if node tests/auth-storage-regression.mjs; then
            echo 'ERROR: v1.02 unexpectedly passed stuck-auth regression' >&2; exit 1
          else
            echo 'Reproduced v1.02 unbounded authorization-storage path'
          fi
          python - <<'PY'
          from pathlib import Path
          def exact(path, old, new, count=1):
              p=Path(path); text=p.read_text(); n=text.count(old)
              if n!=count: raise SystemExit(f'{path}: expected {count} matches, found {n}')
              p.write_text(text.replace(old,new,count))
          api=Path('v2/api.js'); text=api.read_text()
          old="  const READY_TIMEOUT_MS = 20000;\n"
          new="  const READY_TIMEOUT_MS = 20000;\n  const AUTH_STORAGE_TIMEOUT_MS = 5000;\n"
          if text.count(old)!=1: raise SystemExit('api timeout baseline mismatch')
          text=text.replace(old,new,1)
          for oldname,newname in [
              ('async function readIndexedAuth()','async function readIndexedAuthUnbounded()'),
              ('async function writeIndexedAuth(code)','async function writeIndexedAuthUnbounded(code)'),
              ('async function deleteIndexedAuth()','async function deleteIndexedAuthUnbounded()')]:
              if text.count(oldname)!=1: raise SystemExit(f'api baseline mismatch: {oldname}')
              text=text.replace(oldname,newname,1)
          marker="  async function readCode() {\n"
          wrappers="""  function authStorageDeadline(value) {\n    return new Promise(resolve => {\n      setTimeout(() => resolve(value), AUTH_STORAGE_TIMEOUT_MS);\n    });\n  }\n\n  function readIndexedAuth() {\n    return Promise.race([\n      readIndexedAuthUnbounded(),\n      authStorageDeadline('')\n    ]);\n  }\n\n  function writeIndexedAuth(code) {\n    return Promise.race([\n      writeIndexedAuthUnbounded(code),\n      authStorageDeadline(false)\n    ]);\n  }\n\n  function deleteIndexedAuth() {\n    return Promise.race([\n      deleteIndexedAuthUnbounded(),\n      authStorageDeadline(undefined)\n    ]);\n  }\n\n"""
          if text.count(marker)!=1: raise SystemExit('readCode marker mismatch')
          api.write_text(text.replace(marker,wrappers+marker,1))
          exact('version.json','"version": "v1.02"','"version": "v1.03"')
          exact('v2/index.html','data-app-version="v1.02"','data-app-version="v1.03"')
          exact('v2/index.html','data-version="v1.02"','data-version="v1.03"')
          exact('v2/index.html','<span id="settingsFrontendVersion">v1.02</span>','<span id="settingsFrontendVersion">v1.03</span>')
          exact('v2/app.js',"setText('settingsFrontendVersion', 'v1.02');","setText('settingsFrontendVersion', 'v1.03');")
          exact('v2/sw.js','// App version: v1.02','// App version: v1.03')
          exact('v2/sw.js',"const CACHE_NAME = `${CACHE_PREFIX}shell-v50`;","const CACHE_NAME = `${CACHE_PREFIX}shell-v51`;")
          exact('package.json','node tests/backend-contract.cjs && node tests/actual-usd-backend.cjs && node tests/frontend-regressions.mjs','node tests/backend-contract.cjs && node tests/actual-usd-backend.cjs && node tests/auth-storage-regression.mjs && node tests/frontend-regressions.mjs')
          PY
          node scripts/check-version.cjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          rm -rf /tmp/spend-prev && mkdir -p /tmp/spend-prev/v2
          git show ede5717ab3a43a39bb52eb86318561d6b9568d91:v2/index.html > /tmp/spend-prev/v2/index.html
          SPEND_HTML_ROOT=/tmp/spend-prev node tests/frontend-regressions.mjs
          for file in *.js *.gs v2/*.js; do node --check < "$file"; done
          git diff --check
          rm -f .github/workflows/audit-auth-storage-fix.yml .github/workflows/audit-auth-storage-fix-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bound auth storage waits; release v1.03'
          git push origin HEAD:audit/auth-storage-v1.03
