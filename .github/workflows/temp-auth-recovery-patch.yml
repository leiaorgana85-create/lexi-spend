name: Temporary Spend auth-recovery patch
on:
  push:
    branches: [fix/spend-backend-auth-recovery-v105]
permissions:
  contents: write
jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spend-backend-auth-recovery-v105
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply narrow frontend patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          def replace_exact(path, old, new, expected=1):
              p=Path(path); s=p.read_text(); n=s.count(old); assert n==expected, f'{path}: expected {expected}, found {n}'; p.write_text(s.replace(old,new))
          helper=base64.b64decode('').decode()
          test=base64.b64decode('').decode()
          p=Path('v2/api.js'); s=p.read_text(); marker='  function waitReady() {\n'; assert s.count(marker)==1; s=s.replace(marker,helper+marker)
          old="        reject(new Error('Could not connect to the Lexi Spend backend.'));\n"; new="        const error = new Error('Backend access may need authorization.');\n        error.code = 'BACKEND_AUTHORIZATION_REQUIRED';\n        reject(error);\n        setTimeout(() => setBackendRecoveryPrompt(true), 0);\n"; assert s.count(old)==1; s=s.replace(old,new)
          old="      readyResolve?.();\n      readyPromise = Promise.resolve();\n"; new="      readyResolve?.();\n      setBackendRecoveryPrompt(false);\n      readyPromise = Promise.resolve();\n"; assert s.count(old)==1; s=s.replace(old,new)
          old="  ensureFrame();\n\n  window.SpendApi = Object.freeze({\n"; new="  document.addEventListener?.('visibilitychange', () => {\n    if (document.visibilityState !== 'visible' || !backendRecoveryActive || pending.size) return;\n    resetBridge();\n    setTimeout(() => window.dispatchEvent?.(new Event('online')), 250);\n  });\n\n  ensureFrame();\n\n  window.SpendApi = Object.freeze({\n"; assert s.count(old)==1; p.write_text(s.replace(old,new))
          replace_exact('v2/app.js', "setText('settingsFrontendVersion', 'v1.04');", "setText('settingsFrontendVersion', 'v1.05');")
          replace_exact('v2/index.html','v1.04','v1.05',3)
          replace_exact('v2/sw.js','// App version: v1.04','// App version: v1.05')
          replace_exact('v2/sw.js','shell-v52','shell-v53')
          replace_exact('version.json','"version": "v1.04"','"version": "v1.05"')
          Path('tests/backend-authorization-recovery.mjs').write_text(test)
          replace_exact('package.json','node tests/auth-storage-regression.mjs && node tests/frontend-regressions.mjs','node tests/auth-storage-regression.mjs && node tests/backend-authorization-recovery.mjs && node tests/frontend-regressions.mjs')
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/check-version.cjs
      - name: Syntax and diff checks
        run: |
          node --check v2/api.js
          node --check v2/app.js
          node --check v2/sw.js
          node --check tests/backend-authorization-recovery.mjs
          git diff --check
      - name: Commit tested candidate
        run: |
          git config user.name 'leiaorgana85-create'
          git config user.email '330578857+leiaorgana85-create@users.noreply.github.com'
          git add v2/api.js v2/app.js v2/index.html v2/sw.js version.json package.json tests/backend-authorization-recovery.mjs
          git commit -m 'Handle backend authorization recovery; release v1.05'
          git push origin HEAD:fix/spend-backend-auth-recovery-v105
