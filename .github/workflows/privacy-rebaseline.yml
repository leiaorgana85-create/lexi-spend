name: One-time privacy rebaseline
on:
  pull_request:
    paths:
      - scripts/privacy-rebaseline.py
      - .github/workflows/privacy-rebaseline.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only, or apply approved root rewrite
        type: choice
        options: [plan, apply]
        default: plan
      expected_main:
        description: Exact current main SHA from plan (apply only)
        type: string
        required: false
      expected_plan:
        description: PLAN DIGEST from plan run (apply only)
        type: string
        required: false
      confirm:
        description: Type REWRITE to remove old branch/tag ancestry (apply only)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: one-time-privacy-rebaseline
  cancel-in-progress: false
jobs:
  synthetic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/privacy-rebaseline.py --self-test
  owner-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    needs: synthetic-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing live Pages source
        run: node scripts/check-version.cjs --live
      - name: Run approved plan or atomic rewrite
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_MAIN: ${{ inputs.expected_main }}
          EXPECTED_PLAN: ${{ inputs.expected_plan }}
          CONFIRM: ${{ inputs.confirm }}
        run: python3 scripts/privacy-rebaseline.py
      - name: Verify unchanged live Pages source
        if: inputs.mode == 'apply'
        run: node scripts/check-version.cjs --live
